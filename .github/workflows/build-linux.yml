name: Build Ghostty for Linux

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-linux.yml
      - integration.patch
      - install-module.sh
      - modules/**
  schedule:
    - cron: '38 16 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghostty-linux-x86_64
  cancel-in-progress: true

jobs:
  upstream:
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      build: ${{ steps.release.outputs.build }}
    steps:
      - name: Resolve the latest stable Ghostty tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --tags --refs --sort=-v:refname https://github.com/ghostty-org/ghostty.git 'refs/tags/v[0-9]*' > "$RUNNER_TEMP/tags"
          tag="$(awk '$2 ~ /^refs\/tags\/v[0-9]+\.[0-9]+\.[0-9]+$/ && !found {sub(/^refs\/tags\//, "", $2); print $2; found=1}' "$RUNNER_TEMP/tags")"
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == schedule ]] &&
             gh release view "ghostty-${tag}-linux" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/assets" &&
             grep -Fxq "Ghostty-${tag}-Linux-x86_64.tar.gz" "$RUNNER_TEMP/assets"; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: upstream
    if: needs.upstream.outputs.build == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      GHOSTTY_TAG: ${{ needs.upstream.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the module into a fresh upstream checkout
        id: module
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$GHOSTTY_TAG" https://github.com/ghostty-org/ghostty.git upstream
          bash install-module.sh upstream
          version="$(sed -nE 's/.*\.minimum_zig_version = "([^"]+)".*/\1/p' upstream/build.zig.zon)"
          test -n "$version"
          echo "zig=$version" >> "$GITHUB_OUTPUT"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ steps.module.outputs.zig }}
      - name: Install GTK build dependencies
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          apt_options=(-o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          sudo apt-get "${apt_options[@]}" update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get "${apt_options[@]}" install -y gettext libadwaita-1-dev libegl-dev minisign \
            libgtk-4-dev libgtk4-layer-shell-dev libwayland-dev libx11-dev ncurses-bin pkg-config wayland-protocols
          pkg-config --modversion gtk4 libadwaita-1 egl gtk4-layer-shell-0
      - name: Load the signed release's prebuilt GTK resources
        shell: bash
        run: |
          set -euo pipefail
          version="${GHOSTTY_TAG#v}"
          name="ghostty-$version"
          archive="$RUNNER_TEMP/$name.tar.gz"
          url="https://release.files.ghostty.org/$version/$name.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" "$url"
          curl --fail --silent --show-error --location --retry 3 --output "$archive.minisig" "$url.minisig"
          minisign -Vm "$archive" -P 'RWQlAjJC23149WL2sEpT/l0QKy7hMIFhYdQOFy0Z7z7PbneUgvlsnYcV'
          tar -xzf "$archive" -C upstream --strip-components=1 \
            "$name/src/apprt/gtk/ghostty_resources.c" "$name/src/apprt/gtk/ghostty_resources.h"
      - name: Compile Ghostty with GTK
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          zig test src/renderer/CursorTrail.zig
          zig build -Dapp-runtime=gtk -Dcpu=baseline -Doptimize=ReleaseFast -Demit-docs=false -fsys=gtk4-layer-shell \
            --prefix "$RUNNER_TEMP/ghostty-linux"
      - name: Verify and package the Linux build
        shell: bash
        run: |
          set -euo pipefail
          name="Ghostty-${GHOSTTY_TAG}-Linux-x86_64"
          install_dir="$RUNNER_TEMP/ghostty-linux"
          mv "$install_dir" "$RUNNER_TEMP/$name"
          executable="$RUNNER_TEMP/$name/bin/ghostty"
          test "$(uname -m)" = x86_64
          readelf -h "$executable" | grep -F 'Advanced Micro Devices X86-64'
          ldd "$executable" > "$RUNNER_TEMP/libraries"
          if grep -F 'not found' "$RUNNER_TEMP/libraries"; then exit 1; fi
          "$executable" +version
          test -d "$RUNNER_TEMP/$name/share/ghostty"
          TERMINFO="$RUNNER_TEMP/$name/share/terminfo" infocmp xterm-ghostty > /dev/null
          mkdir -p dist
          tar -czf "dist/$name.tar.gz" -C "$RUNNER_TEMP" "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ghostty-${{ env.GHOSTTY_TAG }}-Linux-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [upstream, build]
    if: github.ref_name == github.event.repository.default_branch && needs.build.result == 'success'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GHOSTTY_TAG: ${{ needs.upstream.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Ghostty-${{ env.GHOSTTY_TAG }}-Linux-x86_64
          path: dist
      - name: Publish the Linux x86_64 build
        shell: bash
        run: |
          set -euo pipefail
          tag="ghostty-${GHOSTTY_TAG}-linux"
          asset="dist/Ghostty-${GHOSTTY_TAG}-Linux-x86_64.tar.gz"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
              --title "Ghostty $GHOSTTY_TAG · Linux x86_64" \
              --notes "GTK build for Linux x86_64 using Ubuntu 26.04 system libraries. Extract the archive and launch bin/ghostty; keep share/ next to bin/. The native cursor trail is available on macOS."
          fi
